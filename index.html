<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Precatórios - DataJud</title>
    <style>
        /* ... (mantenha os estilos anteriores) ... */
    </style>
</head>
<body>
    <!-- ... (mantenha o HTML anterior) ... -->

    <script>
        // =============================================================
        //  CONFIGURAÇÕES ATUALIZADAS
        // =============================================================
        const CONFIG = {
            API_KEY: 'cDZHYzlZa0JadVREZDJCendQbXY6SkJlTzNjLV9TRENyQk1RdnFKZGRQdw==',
            ENDPOINTS: {
                trf1: 'https://api-publica.datajud.cnj.jus.br/api_publica_trf1/_search',
                trf2: 'https://api-publica.datajud.cnj.jus.br/api_publica_trf2/_search',
                trf3: 'https://api-publica.datajud.cnj.jus.br/api_publica_trf3/_search',
                trf4: 'https://api-publica.datajud.cnj.jus.br/api_publica_trf4/_search',
                trf5: 'https://api-publica.datajud.cnj.jus.br/api_publica_trf5/_search',
                trf6: 'https://api-publica.datajud.cnj.jus.br/api_publica_trf6/_search'
            }
        };

        // =============================================================
        //  PROXIES DISPONÍVEIS (TENTA AUTOMATICAMENTE)
        // =============================================================
        const PROXIES = [
            {
                nome: 'AllOrigins',
                url: (endpoint) => `https://api.allorigins.win/raw?url=${encodeURIComponent(endpoint)}`
            },
            {
                nome: 'CORS Anywhere',
                url: (endpoint) => `https://cors-anywhere.herokuapp.com/${endpoint}`
            },
            {
                nome: 'ThingProxy',
                url: (endpoint) => `https://thingproxy.freeboard.io/fetch/${endpoint}`
            },
            {
                nome: 'CORSProxy.io',
                url: (endpoint) => `https://corsproxy.io/?${encodeURIComponent(endpoint)}`
            }
        ];

        let proxyAtual = 0; // Começa com o primeiro proxy
        let usarProxy = true;

        // =============================================================
        //  FUNÇÃO PARA TESTAR PROXY
        // =============================================================
        async function testarProxy(endpoint, apiKey) {
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Authorization': `APIKey ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        query: { match_all: {} },
                        size: 1
                    }),
                    timeout: 5000
                });
                return response.ok;
            } catch {
                return false;
            }
        }

        // =============================================================
        //  FUNÇÃO PARA ENCONTRAR PROXY FUNCIONAL
        // =============================================================
        async function encontrarProxyFuncional(endpointOriginal) {
            console.log('🔍 Procurando proxy funcional...');
            
            for (let i = 0; i < PROXIES.length; i++) {
                const proxy = PROXIES[i];
                const endpointProxy = proxy.url(endpointOriginal);
                
                console.log(`📡 Testando ${proxy.nome}...`);
                
                const funciona = await testarProxy(endpointProxy, CONFIG.API_KEY);
                
                if (funciona) {
                    console.log(`✅ ${proxy.nome} funcionou!`);
                    proxyAtual = i;
                    return endpointProxy;
                } else {
                    console.log(`❌ ${proxy.nome} falhou.`);
                }
            }
            
            console.log('❌ Nenhum proxy funcionou.');
            return null;
        }

        // =============================================================
        //  CONSULTA DE PRECATÓRIOS (ATUALIZADA)
        // =============================================================
        async function consultarPrecatorio() {
            const cpfInput = document.getElementById('cpfConsulta');
            const tribunalSelect = document.getElementById('tribunalConsulta');
            const btn = document.getElementById('btnConsultar');
            const loading = document.getElementById('loading');
            const resultados = document.getElementById('resultados');
            const listaResultados = document.getElementById('listaResultados');
            const totalResultados = document.getElementById('totalResultados');

            const cpf = cpfInput.value.replace(/\D/g, '');
            const tribunal = tribunalSelect.value;

            console.log('🔍 Iniciando consulta...');
            console.log('📝 CPF:', cpf, 'Tamanho:', cpf.length);
            console.log('🏛️ Tribunal:', tribunal);

            if (!cpf || cpf.length !== 11) {
                alert(`⚠️ CPF deve ter 11 dígitos. Você digitou ${cpf.length || 0} dígitos.`);
                return;
            }

            if (!tribunal) {
                alert('⚠️ Por favor, selecione um tribunal.');
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳ Consultando...';
            loading.classList.add('visible');
            resultados.classList.remove('visible');
            listaResultados.innerHTML = '';

            try {
                let endpoint = CONFIG.ENDPOINTS[tribunal];
                let proxyUsado = false;

                // Tenta usar proxy se ativado
                if (usarProxy) {
                    console.log('🌐 Tentando usar proxy...');
                    
                    // Tenta encontrar um proxy funcional
                    const endpointProxy = await encontrarProxyFuncional(endpoint);
                    
                    if (endpointProxy) {
                        endpoint = endpointProxy;
                        proxyUsado = true;
                        console.log('✅ Proxy encontrado e funcionando!');
                    } else {
                        console.log('⚠️ Nenhum proxy funcionou. Tentando sem proxy...');
                        // Se nenhum proxy funcionou, tenta direto
                        proxyUsado = false;
                    }
                }

                console.log('🌐 Endpoint final:', endpoint);

                const payload = {
                    query: {
                        bool: {
                            should: [
                                { match: { "partes.cpfOuCnpj": cpf } },
                                { match: { "partes.cpfCnpj": cpf } },
                                { match: { "cpfParte": cpf } },
                                { match: { "partes.cpf": cpf } },
                                { match: { "cpf": cpf } }
                            ]
                        }
                    },
                    size: 50
                };

                console.log('📤 Payload enviado');

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Authorization': `APIKey ${CONFIG.API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                console.log('📥 Status:', response.status);

                if (!response.ok) {
                    let errorText = await response.text();
                    throw new Error(`Erro ${response.status}: ${errorText.substring(0, 100)}`);
                }

                const data = await response.json();
                console.log('✅ Resposta recebida! Total:', data.hits?.total?.value || 0);

                AUTH.registrarLog(cpf, tribunal);
                carregarLogs();

                const processos = processarResultados(data, cpf);

                if (processos.length === 0) {
                    listaResultados.innerHTML = `
                        <div class="sem-resultados">
                            <div class="icon">🔍</div>
                            <p><strong>Nenhum processo encontrado</strong></p>
                            <p style="font-size:14px;color:#a0aec0;margin-top:5px;">
                                Não encontramos processos com o CPF ${formatarCPFExibicao(cpf)} no ${tribunal.toUpperCase()}.
                            </p>
                            <p style="font-size:13px;color:#a0aec0;margin-top:10px;">
                                💡 Dica: Verifique se o CPF está correto ou tente em outro tribunal.
                            </p>
                        </div>
                    `;
                    totalResultados.textContent = '0 processos encontrados';
                } else {
                    totalResultados.textContent = `${processos.length} processo(s) encontrado(s)`;
                    listaResultados.innerHTML = processos.map(p => renderizarProcesso(p)).join('');
                }

                resultados.classList.add('visible');

            } catch (error) {
                console.error('❌ ERRO:', error);

                let mensagemErro = error.message;
                if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
                    mensagemErro = '❌ Não foi possível conectar à API. Tente as opções abaixo:';
                }

                listaResultados.innerHTML = `
                    <div class="sem-resultados" style="color:#e53e3e;border:1px solid #fed7d7;border-radius:8px;padding:20px;">
                        <div class="icon">❌</div>
                        <p><strong>Erro na consulta</strong></p>
                        <p style="font-size:14px;margin-top:8px;color:#c53030;">${mensagemErro}</p>
                        <div style="font-size:12px;color:#718096;margin-top:10px;background:#f7fafc;padding:10px;border-radius:4px;text-align:left;">
                            <strong>Diagnóstico:</strong><br>
                            • CPF: ${formatarCPFExibicao(cpf)}<br>
                            • Tribunal: ${tribunal}<br>
                            • Proxy: ${usarProxy ? 'ATIVO' : 'INATIVO'}<br>
                            • Proxy usado: ${proxyAtual + 1} de ${PROXIES.length}<br>
                            • Hora: ${new Date().toLocaleString()}
                        </div>
                        <div style="margin-top:10px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
                            <button onclick="consultarPrecatorio()" style="padding:8px 16px;background:#1a2a6c;color:#fff;border:none;border-radius:4px;cursor:pointer;">
                                🔄 Tentar novamente
                            </button>
                            <button onclick="alternarProxy()" style="padding:8px 16px;background:#d69e2e;color:#fff;border:none;border-radius:4px;cursor:pointer;">
                                🔄 Alternar Proxy
                            </button>
                        </div>
                    </div>
                `;
                resultados.classList.add('visible');
            } finally {
                btn.disabled = false;
                btn.textContent = '🔍 Consultar';
                loading.classList.remove('visible');
            }
        }

        // =============================================================
        //  FUNÇÃO PARA ALTERNAR PROXY
        // =============================================================
        function alternarProxy() {
            proxyAtual = (proxyAtual + 1) % PROXIES.length;
            const proxyNome = PROXIES[proxyAtual].nome;
            document.getElementById('proxyStatus').textContent = `(Proxy: ${proxyNome})`;
            console.log(`🔄 Alternando para proxy: ${proxyNome}`);
            alert(`✅ Proxy alterado para: ${proxyNome}\nTente a consulta novamente.`);
        }

        // Função toggleProxy (mantida para compatibilidade)
        function toggleProxy() {
            usarProxy = !usarProxy;
            document.getElementById('proxyStatus').textContent = usarProxy ? 
                `(Proxy: ${PROXIES[proxyAtual].nome})` : 
                '(Proxy: INATIVO)';
            console.log('🔧 Modo proxy:', usarProxy ? 'ATIVO' : 'INATIVO');
            alert(usarProxy ?
                '✅ Proxy ativado. Usando ' + PROXIES[proxyAtual].nome :
                '⚠️ Proxy desativado. Use um servidor local para evitar CORS.');
        }

        // ... (resto do código permanece igual - AUTH, UI, etc.)
    </script>
</body>
</html>
